<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="By the numbers: 83 Jest tests in MutualMind, 52 REST endpoints, 0.845 ROC AUC on the retention model, 3.54 times return on the retention budget.">
  <title>By the numbers</title>

  <defs>
    <linearGradient id="npaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F8F2E7"/>
      <stop offset="55%"  stop-color="#F3EBDD"/>
      <stop offset="100%" stop-color="#EDE3D2"/>
    </linearGradient>

    <style>
      .fig {
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        font-size: 52px; fill: #A32E2A;
      }
      .lab {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
                     "Liberation Mono", monospace;
        font-size: 14px; fill: #7A6A5C; letter-spacing: 0.06em;
      }
      .cap {
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        font-style: italic; font-size: 15px; fill: #9C8C7B;
      }

      .col { opacity: 0; animation: rise 9s ease-out infinite; }
      .c2 { animation-delay: 0.28s; }
      .c3 { animation-delay: 0.56s; }
      .c4 { animation-delay: 0.84s; }

      @keyframes rise {
        0%   { opacity: 0; transform: translateY(12px); }
        7%   { opacity: 1; transform: translateY(0); }
        88%  { opacity: 1; transform: translateY(0); }
        97%  { opacity: 0; transform: translateY(-6px); }
        100% { opacity: 0; transform: translateY(12px); }
      }

      .tick { stroke: #A32E2A; stroke-width: 1.6; stroke-linecap: round; opacity: 0.45; }

      @media (prefers-reduced-motion: reduce) {
        .col { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="150" rx="4" fill="url(#npaper)"/>

  <text class="cap" x="40" y="34">by the numbers &#8212; every figure verified against the codebase</text>

  <g class="col">
    <text class="fig" x="40"  y="102">83</text>
    <text class="lab" x="40"  y="128">JEST TESTS &#183; MUTUALMIND</text>
  </g>
  <g class="col c2">
    <text class="fig" x="370" y="102">52</text>
    <text class="lab" x="370" y="128">REST ENDPOINTS</text>
  </g>
  <g class="col c3">
    <text class="fig" x="640" y="102">0.845</text>
    <text class="lab" x="640" y="128">ROC AUC &#183; 5-FOLD CV</text>
  </g>
  <g class="col c4">
    <text class="fig" x="950" y="102">3.54&#215;</text>
    <text class="lab" x="950" y="128">RETURN ON RETENTION SPEND</text>
  </g>

  <path class="tick" d="M40 140 C 300 136, 700 144, 1160 138" fill="none"/>
</svg>
