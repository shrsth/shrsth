<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="presentation" aria-hidden="true">
  <title>section divider</title>
  <style>
    .ink { animation: draw 9s ease-in-out infinite; }
    @keyframes draw {
      0%       { stroke-dashoffset: 1; }
      22%, 78% { stroke-dashoffset: 0; }
      100%     { stroke-dashoffset: -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ink { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <path class="ink" pathLength="1" stroke-dasharray="1 1"
        d="M8 11 C 210 4, 430 17, 660 10 S 1020 4, 1192 12"
        fill="none" stroke="#A32E2A" stroke-width="1.8"
        stroke-linecap="round" opacity="0.5"/>
</svg>
