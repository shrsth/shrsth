<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Shresth Modi, AI/ML engineer in Bengaluru. Retrieval-augmented generation, LLM agents, and machine learning that ends in a decision. B.E. Information Science 2027, RVITM.">
  <title>Shresth Modi — AI/ML engineer</title>

  <defs>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#F8F2E7"/>
      <stop offset="48%"  stop-color="#F3EBDD"/>
      <stop offset="100%" stop-color="#EDE3D2"/>
    </linearGradient>

    <radialGradient id="bloom" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0%"   stop-color="#FFFCF5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFCF5" stop-opacity="0"/>
    </radialGradient>

    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>

    <style>
      .name  { font-family: "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif; }
      .hand  { font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; }
      .body  { font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }

      .swash { animation: ink 9s ease-in-out infinite; }
      @keyframes ink {
        0%          { stroke-dashoffset: 1; }
        22%, 78%    { stroke-dashoffset: 0; }
        100%        { stroke-dashoffset: -1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .swash { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="4" fill="url(#paper)"/>
  <rect width="1200" height="300" rx="4" fill="url(#bloom)"/>
  <rect width="1200" height="300" rx="4" filter="url(#fibre)" opacity="0.055"/>

  <!-- name -->
  <text class="name" x="76" y="136" font-size="66" fill="#2E2620">Shresth Modi</text>

  <!-- hand-drawn ink swash, always readable text above it -->
  <path class="swash" pathLength="1" stroke-dasharray="1 1"
        d="M78 160 C 168 150, 262 170, 352 158 S 470 146, 512 159"
        fill="none" stroke="#A32E2A" stroke-width="2.6" stroke-linecap="round"/>

  <!-- role -->
  <text class="hand" x="78" y="199" font-size="24" fill="#7A6A5C">AI/ML engineer, Bengaluru</text>

  <!-- lede -->
  <text class="body" x="78" y="240" font-size="18.5" fill="#5C4F45">Retrieval-augmented generation, LLM agents, and machine learning that ends in a decision.</text>

  <!-- footnote -->
  <text class="hand" x="78" y="270" font-size="15" fill="#9C8C7B">B.E. Information Science &#8217;27 &#183; RVITM, Bengaluru</text>
</svg>
